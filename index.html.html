<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa PDVs · Porto Alegre</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

header {
  background: #161b27; border-bottom: 1px solid #1e2d45;
  padding: 0 16px; height: 52px; display: flex; align-items: center;
  gap: 12px; flex-shrink: 0; z-index: 1000;
}
.logo { font-weight: 700; font-size: 15px; color: #fff; }
.logo span { color: #38bdf8; }
.hdr-sep { width: 1px; height: 20px; background: #1e2d45; }
.hdr-info { font-size: 11.5px; color: #64748b; }
.hdr-info b { color: #94a3b8; font-weight: 600; }
.hdr-right { margin-left: auto; display: flex; gap: 6px; }
.hbtn {
  padding: 5px 12px; border-radius: 5px; border: 1px solid #1e2d45;
  background: #1a2235; color: #94a3b8; font-size: 11.5px;
  font-family: 'Inter', sans-serif; cursor: pointer; transition: all .15s; font-weight: 500;
}
.hbtn:hover { background: #1e2d45; color: #e2e8f0; }
.hbtn.on { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }

#status {
  height: 28px; display: flex; align-items: center; gap: 8px;
  padding: 0 16px; font-size: 11px; background: #0c1a2b;
  border-bottom: 1px solid #0e2036; color: #38bdf8; flex-shrink: 0;
}
.sdot { width: 5px; height: 5px; border-radius: 50%; background: #38bdf8; animation: blink 1.4s infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }
#status.done { background: transparent; color: #475569; border-color: transparent; }
#status.done .sdot { background: #475569; animation: none; }
#prog-wrap { height: 3px; background: #1e2d45; flex-shrink: 0; }
#prog-fill { height: 100%; width: 0; background: linear-gradient(90deg, #0ea5e9, #6366f1); transition: width .4s; }

.layout { display: flex; flex: 1; overflow: hidden; }
#sidebar {
  width: 290px; background: #111827; border-right: 1px solid #1e2d45;
  overflow-y: auto; flex-shrink: 0;
  scrollbar-width: thin; scrollbar-color: #1e2d45 transparent;
}
.sb-block { padding: 12px 14px; border-bottom: 1px solid #1a2235; }
.sb-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #475569; margin-bottom: 8px; }

/* MODE TOGGLE */
.mode-row { display: flex; gap: 4px; }
.mode-btn {
  flex: 1; padding: 7px 4px; border-radius: 5px; border: 1px solid #1e2d45;
  background: #1a2235; color: #64748b; font-size: 11px; font-weight: 600;
  font-family: 'Inter', sans-serif; cursor: pointer; text-align: center; transition: all .15s;
}
.mode-btn.on { background: #0ea5e9 !important; border-color: #0ea5e9 !important; color: #fff !important; }

/* LEGENDA SETORES */
.setor-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; cursor: pointer; border-radius: 4px; transition: all .12s;
}
.setor-item:hover { background: rgba(255,255,255,.03); padding-left: 4px; }
.setor-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,.2); }
.setor-name { font-size: 11px; flex: 1; line-height: 1.3; }
.setor-count { font-size: 10px; color: #475569; background: #1a2235; padding: 1px 7px; border-radius: 8px; }
.setor-item.off .setor-name { color: #334155; text-decoration: line-through; }
.setor-item.off .setor-dot { opacity: .25; }

/* LEGENDA BRICKS */
.brick-search {
  width: 100%; background: #0f1117; border: 1px solid #1e2d45; color: #e2e8f0;
  padding: 5px 8px; border-radius: 4px; font-size: 10.5px;
  font-family: 'Inter', sans-serif; outline: none; margin-bottom: 6px;
}
.brick-search:focus { border-color: #0ea5e9; }
.brick-list { max-height: 300px; overflow-y: auto; }
.brick-item {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 0; cursor: pointer; transition: all .12s;
  font-size: 10px;
}
.brick-item:hover { background: rgba(255,255,255,.03); padding-left: 4px; }
.brick-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.brick-name { flex: 1; color: #94a3b8; line-height: 1.2; }
.brick-count { color: #475569; font-size: 9px; }

/* STATS */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat { background: #0f1117; border: 1px solid #1e2d45; border-radius: 5px; padding: 7px 9px; }
.stat-n { font-size: 20px; font-weight: 700; color: #38bdf8; }
.stat-l { font-size: 9.5px; color: #475569; margin-top: 1px; }

.sb-search {
  width: 100%; background: #0f1117; border: 1px solid #1e2d45; color: #e2e8f0;
  padding: 6px 9px; border-radius: 5px; font-size: 11.5px;
  font-family: 'Inter', sans-serif; outline: none; transition: border-color .15s;
}
.sb-search:focus { border-color: #0ea5e9; }
.sb-search::placeholder { color: #334155; }

#map { flex: 1; }

/* TOOLTIP (hover) */
.leaflet-tooltip.pdv-tip {
  background: #161b27; border: 1px solid #1e2d45; color: #e2e8f0;
  padding: 9px 12px; border-radius: 7px; font-family: 'Inter', sans-serif;
  font-size: 11px; box-shadow: 0 6px 20px rgba(0,0,0,.7); white-space: normal;
  max-width: 260px;
}
.leaflet-tooltip.pdv-tip:before { display: none; }
.tip-name { font-weight: 700; font-size: 12px; color: #fff; margin-bottom: 3px; }
.tip-row { color: #94a3b8; line-height: 1.4; }
.tip-row b { color: #cbd5e1; }
.tip-setor { display: inline-block; margin-top: 5px; padding: 2px 7px; border-radius: 8px; font-size: 9.5px; font-weight: 700; }

/* POPUP (click) */
.leaflet-popup-content-wrapper {
  background: #161b27 !important; border: 1px solid #1e2d45 !important;
  border-radius: 8px !important; box-shadow: 0 8px 24px rgba(0,0,0,.7) !important;
  color: #e2e8f0 !important;
}
.leaflet-popup-tip { background: #161b27 !important; }
.leaflet-popup-content { margin: 12px 14px !important; }
.pop-h { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.pop-cnpj { font-size: 9.5px; color: #38bdf8; font-family: monospace; margin-bottom: 7px; }
.pop-row { font-size: 11px; color: #94a3b8; margin-bottom: 3px; line-height: 1.4; }
.pop-row b { color: #cbd5e1; }
.pop-warn { margin-top: 7px; padding: 5px 8px; background: #1a1200; border: 1px solid #713f12; border-radius: 5px; font-size: 10px; color: #fbbf24; }
</style>
</head>
<body>

<header>
  <div class="logo">Setor<span>Map</span></div>
  <div class="hdr-sep"></div>
  <div class="hdr-info">Porto Alegre/RS &nbsp;|&nbsp; <b>727</b> PDVs · <b>128</b> bricks · <b>4</b> setores</div>
  <div class="hdr-right">
    <button class="hbtn" id="btnSat" onclick="toggleSat()">Satélite</button>
    <button class="hbtn" onclick="map.setView([-30.05,-51.18],12)">Centralizar</button>
  </div>
</header>
<div id="status"><div class="sdot"></div><span id="stxt">Iniciando geocodificação…</span></div>
<div id="prog-wrap"><div id="prog-fill"></div></div>

<div class="layout">
  <div id="sidebar">

    <div class="sb-block">
      <div class="sb-lbl">Colorir pontos por</div>
      <div class="mode-row">
        <button class="mode-btn on" id="mSetor" onclick="setMode('setor')">Setor</button>
        <button class="mode-btn" id="mBrick" onclick="setMode('brick')">Brick</button>
      </div>
    </div>

    <div class="sb-block" id="setorBlock">
      <div class="sb-lbl">Setores — clique para ocultar</div>
      <div id="setorLegend"></div>
    </div>

    <div class="sb-block" id="brickBlock" style="display:none">
      <div class="sb-lbl">Bricks (128) — clique para ocultar</div>
      <input class="brick-search" id="brickSearch" placeholder="Filtrar bricks…" oninput="filterBricks(this.value)">
      <div class="brick-list" id="brickLegend"></div>
    </div>

    <div class="sb-block">
      <div class="sb-lbl">Buscar PDV</div>
      <input class="sb-search" id="sbSearch" placeholder="Nome, CNPJ ou endereço…" oninput="doSearch(this.value)">
    </div>

    <div class="sb-block">
      <div class="sb-lbl">Estatísticas</div>
      <div class="stats">
        <div class="stat"><div class="stat-n" id="sLoc">0</div><div class="stat-l">Localizadas</div></div>
        <div class="stat"><div class="stat-n" id="sPend">727</div><div class="stat-l">Pendentes</div></div>
        <div class="stat"><div class="stat-n" id="sFail" style="color:#f87171">0</div><div class="stat-l">Não encontradas</div></div>
        <div class="stat"><div class="stat-n" id="sExato" style="color:#34d399">496</div><div class="stat-l">Endereço exato</div></div>
      </div>
    </div>

  </div>
  <div id="map"></div>
</div>

function formatCNPJ(c) {
  return c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function getColor(pdv) {
  return mode === 'setor'
    ? (SETOR_COLORS[pdv.setor] || { color: '#64748b' }).color
    : (brickColorMap[pdv.brick] || '#64748b');
}
function isConflict(pdv) {
  if (pdv.setor.indexOf('VAGO') >= 0) return false;
  const dom = brickSetorMap[pdv.brick];
  return dom && dom !== pdv.setor;
}
function isHidden(pdv) {
  if (hiddenSetores.has(pdv.setor)) return true;
  if (mode === 'brick' && hiddenBricks.has(pdv.brick)) return true;
  return false;
}

function makeIcon(color, conflict) {
  const ring = conflict ? 'stroke="#fbbf24" stroke-width="3"' : 'stroke="rgba(0,0,0,.4)" stroke-width="1.5"';
  const svg = '<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">'
    + '<circle cx="8" cy="8" r="6.5" fill="' + color + '" ' + ring + '/>'
    + (conflict ? '' : '<circle cx="8" cy="8" r="2.5" fill="rgba(255,255,255,.65)"/>')
    + '</svg>';
  return L.divIcon({ html: svg, className: '', iconSize: [16,16], iconAnchor: [8,8], popupAnchor: [0,-10] });
}

function buildSetorLegend() {
  document.getElementById('setorLegend').innerHTML = Object.entries(SETOR_COLORS).map(function(e) {
    const k = e[0], v = e[1];
    const cnt = DATA.filter(p => p.setor === k).length;
    const off = hiddenSetores.has(k) ? 'off' : '';
    const esc = k.replace(/'/g, "\\'");
    return '<div class="setor-item ' + off + '" onclick="toggleSetor(\'' + esc + '\')">'
      + '<div class="setor-dot" style="background:' + v.color + '"></div>'
      + '<div class="setor-name">' + v.label + '</div>'
      + '<div class="setor-count">' + cnt + '</div></div>';
  }).join('');
}

function buildBrickLegend(filter) {
  filter = (filter || '').toLowerCase();
  const html = allBricks.filter(function(b) {
    const lbl = b.replace(/^\d+\s*-\s*PORTO ALEGRE-/, '');
    return !filter || lbl.toLowerCase().indexOf(filter) >= 0 || b.toLowerCase().indexOf(filter) >= 0;
  }).map(function(b) {
    const cnt = DATA.filter(p => p.brick === b).length;
    const off = hiddenBricks.has(b) ? 'off' : '';
    const lbl = b.replace(/^(\d+)\s*-\s*PORTO ALEGRE-/, '$1 · ');
    const esc = b.replace(/'/g, "\\'");
    const dotOpacity = off ? '0.3' : '1';
    return '<div class="brick-item" onclick="toggleBrick(\'' + esc + '\')">'
      + '<div class="brick-dot" style="background:' + brickColorMap[b] + ';opacity:' + dotOpacity + '"></div>'
      + '<div class="brick-name" style="' + (off ? 'text-decoration:line-through;color:#334155' : '') + '">' + lbl + '</div>'
      + '<div class="brick-count">' + cnt + '</div></div>';
  }).join('');
  document.getElementById('brickLegend').innerHTML = html || '<div style="font-size:10px;color:#475569;padding:8px 0">Nenhum brick encontrado</div>';
}

function filterBricks(q) { buildBrickLegend(q); }

function setMode(m) {
  mode = m;
  document.getElementById('mSetor').classList.toggle('on', m === 'setor');
  document.getElementById('mBrick').classList.toggle('on', m === 'brick');
  document.getElementById('setorBlock').style.display = m === 'setor' ? '' : 'none';
  document.getElementById('brickBlock').style.display = m === 'brick' ? '' : 'none';
  if (m === 'brick') buildBrickLegend();
  // Atualiza cores e visibilidade dos marcadores
  Object.values(markerStore).forEach(function(item) {
    item.marker.setIcon(makeIcon(getColor(item.pdv), isConflict(item.pdv)));
    if (isHidden(item.pdv)) layerGroup.removeLayer(item.marker);
    else layerGroup.addLayer(item.marker);
  });
}

function toggleSetor(s) {
  if (hiddenSetores.has(s)) hiddenSetores.delete(s);
  else hiddenSetores.add(s);
  buildSetorLegend();
  Object.values(markerStore).forEach(function(item) {
    if (isHidden(item.pdv)) layerGroup.removeLayer(item.marker);
    else layerGroup.addLayer(item.marker);
  });
}

function toggleBrick(b) {
  if (hiddenBricks.has(b)) hiddenBricks.delete(b);
  else hiddenBricks.add(b);
  buildBrickLegend(document.getElementById('brickSearch').value);
  Object.values(markerStore).forEach(function(item) {
    if (isHidden(item.pdv)) layerGroup.removeLayer(item.marker);
    else layerGroup.addLayer(item.marker);
  });
}

function toggleSat() {
  satOn = !satOn;
  document.getElementById('btnSat').classList.toggle('on', satOn);
  if (satOn) { map.removeLayer(tileOSM); tileSat.addTo(map); }
  else { map.removeLayer(tileSat); tileOSM.addTo(map); }
}

function doSearch(q) {
  if (!q) return;
  const lq = q.toLowerCase();
  const matches = Object.values(markerStore).filter(function(item) {
    return item.pdv.nome.toLowerCase().indexOf(lq) >= 0
        || item.pdv.cnpj.indexOf(lq) >= 0
        || (item.pdv.endereco || '').toLowerCase().indexOf(lq) >= 0;
  });
  if (matches.length === 1) { map.setView(matches[0].marker.getLatLng(), 17); matches[0].marker.openPopup(); }
  else if (matches.length > 1) {
    map.fitBounds(L.latLngBounds(matches.map(m => m.marker.getLatLng())), { padding: [40,40] });
  }
}

function buildTooltipHTML(pdv) {
  const si = SETOR_COLORS[pdv.setor] || { color: '#64748b', label: pdv.setor };
  const brickShort = pdv.brick.replace(/^\d+\s*-\s*PORTO ALEGRE-/, '');
  const brickCode = (pdv.brick.match(/^(\d+)/) || [])[1] || '';
  const endStr = pdv.endereco
    ? pdv.endereco + (pdv.bairro ? ' — ' + pdv.bairro : '')
    : '<span style="color:#64748b;font-style:italic">Sem endereço cadastrado</span>';
  return '<div class="tip-name">🏥 ' + pdv.nome + '</div>'
    + '<div class="tip-row"><b>Endereço:</b> ' + endStr + '</div>'
    + '<div class="tip-row"><b>Brick:</b> ' + brickCode + ' · ' + brickShort + '</div>'
    + '<span class="tip-setor" style="background:' + si.color + '22;color:' + si.color + ';border:1px solid ' + si.color + '55">' + si.label + '</span>';
}

function buildPopupHTML(pdv) {
  const si = SETOR_COLORS[pdv.setor] || { color: '#64748b', label: pdv.setor };
  const di = SETOR_COLORS[brickSetorMap[pdv.brick]] || { color: '#64748b', label: '' };
  const brickShort = pdv.brick.replace(/^\d+\s*-\s*PORTO ALEGRE-/, '');
  const conf = isConflict(pdv);
  const warn = conf
    ? '<div class="pop-warn" style="background:#451a03;border-color:#92400e;color:#fbbf24">⚠ Brick pertence ao setor <b style="color:' + di.color + '">' + di.label + '</b></div>'
    : (pdv.setor.indexOf('VAGO') >= 0 ? '<div class="pop-warn">📋 Sem setor responsável (VAGO)</div>' : '');
  return '<div class="pop-h">🏥 ' + pdv.nome + '</div>'
    + '<div class="pop-cnpj">' + formatCNPJ(pdv.cnpj) + '</div>'
    + '<div class="pop-row"><b>Endereço:</b> ' + (pdv.endereco || '—') + '</div>'
    + '<div class="pop-row"><b>Bairro:</b> ' + (pdv.bairro || '—') + '</div>'
    + '<div class="pop-row"><b>Bandeira:</b> ' + (pdv.bandeira || '—') + '</div>'
    + '<div class="pop-row"><b>Brick:</b> ' + brickShort + '</div>'
    + '<div class="pop-row"><b>Setor:</b> <span style="color:' + si.color + ';font-weight:600">' + si.label + '</span></div>'
    + warn;
}

function addMarker(pdv, lat, lng) {
  const marker = L.marker([lat, lng], { icon: makeIcon(getColor(pdv), isConflict(pdv)) });
  marker.bindTooltip(buildTooltipHTML(pdv), { className: 'pdv-tip', direction: 'top', offset: [0, -8], sticky: false });
  marker.bindPopup(buildPopupHTML(pdv), { maxWidth: 290 });
  markerStore[pdv.cnpj] = { marker: marker, pdv: pdv };
  if (!isHidden(pdv)) layerGroup.addLayer(marker);
}

function updateStats(done, total) {
  const pct = Math.round(done / total * 100);
  document.getElementById('sLoc').textContent = done - failed;
  document.getElementById('sPend').textContent = total - done;
  document.getElementById('sFail').textContent = failed;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('stxt').textContent = 'Geocodificando… ' + done + '/' + total + ' — ' + (done - failed) + ' encontradas';
  if (done === total) {
    document.getElementById('status').className = 'done';
    document.getElementById('stxt').textContent = '✓ ' + (done - failed) + ' PDVs localizados · ' + failed + ' não encontrados';
  }
}

async function geocodePDV(pdv) {

    // "OLAVO BARRETO VIANA, 36,36" → tenta primeiro com primeiro número
    // Normaliza: pega "RUA, NUMERO"
    const m = pdv.endereco.match(/^([^,]+)\s*,\s*(\d+)/);
    if (m) {
      const rua = m[1].trim();
      const num = m[2];
      queries.push(rua + ', ' + num + ', ' + (pdv.bairro || '') + ', Porto Alegre, RS, Brasil');
      queries.push(rua + ', ' + num + ', Porto Alegre, RS, Brasil');
    }
    // Endereço bruto
    queries.push(pdv.endereco + ', Porto Alegre, RS, Brasil');
    // Só a rua + bairro
    const ruaSomente = pdv.endereco.split(',')[0].trim();
    if (ruaSomente && pdv.bairro) {
      queries.push(ruaSomente + ', ' + pdv.bairro + ', Porto Alegre, RS, Brasil');
    }
  }

  // Fallback final: bairro
  if (pdv.bairro) queries.push(pdv.bairro + ', Porto Alegre, RS, Brasil');

  for (let i = 0; i < queries.length; i++) {
    const q = queries[i];
    if (geoCache[q] !== undefined) { if (geoCache[q]) return geoCache[q]; continue; }
    try {
      const r = await fetch(
        'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q) + '&limit=1&countrycodes=br',
        { headers: { 'Accept-Language': 'pt-BR' } }
      );
      const d = await r.json();
      if (d && d[0]) {
        const pos = { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
        geoCache[q] = pos;
        return pos;
      }
      geoCache[q] = null;
    } catch(e) { geoCache[q] = null; }
    await sleep(1100);
  }
  return null;
}

async function runGeo() {
  const total = DATA.length;
  let done = 0;

  for (let i = 0; i < DATA.length; i++) {
    const pdv = DATA[i];
    const pos = await geocodePDV(pdv);
    await sleep(1100);
    if (pos) addMarker(pdv, pos.lat, pos.lng);
    else failed++;
    done++;
    updateStats(done, total);
  }
}

buildSetorLegend();
runGeo();
</script>
